apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pk-bkd-ms-api-stuart
  namespace: stuart
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/protocols: "http"
    konghq.com/preserve-host: "true"
spec:
  ingressClassName: kong
  rules:
    - host: stuart.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pk-bkd-ms-api-stuart
                port:
                  number: 80
