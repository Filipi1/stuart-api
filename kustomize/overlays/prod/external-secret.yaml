apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stuart-api-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-stuart-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: stuart-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: SUPABASE_URL
      remoteRef:
        key: SUPABASE_URL
    - secretKey: SUPABASE_KEY
      remoteRef:
        key: SUPABASE_KEY
