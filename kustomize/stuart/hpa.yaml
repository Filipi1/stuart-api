apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pk-bkd-ms-api-stuart
  namespace: discord
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pk-bkd-ms-api-stuart
  minReplicas: 1
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70