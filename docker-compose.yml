services:
  stuart-api:
    build: .
    ports:
      - "${PORT:-10300}:${PORT:-10300}"
    environment:
      PORT: ${PORT:-10300}
      PYTHONPATH: /app/src:/app/deps
      PYTHONUNBUFFERED: '1'
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, os; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ.get('PORT', '10300')}/health-check\")"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - stuart-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  stuart-network:
    driver: bridge
