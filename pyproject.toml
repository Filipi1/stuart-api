[project]
name = "stuart-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "pydantic-settings>=2.9.1",
    "supabase>=2.15.2",
]

[dependency-groups]
dev = [
    "archpython-cli",
    "black>=25.1.0",
    "pyright>=1.1.401",
    "ruff>=0.11.13",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
lint = "ruff check src --fix && black src"
typecheck = "pyright src"
run_dev = "fastapi dev src/main.py"

[tool.uv.sources]
archpython-cli = { git = "https://github.com/Filipi1/archpython-cli" }
