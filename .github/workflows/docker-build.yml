name: Build and Push Docker Image

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stuart-api
  ARGOCD_APP_NAME: pk-bkd-ms-api-stuart
  ARGOCD_APP_NAMESPACE: argocd
  ARGOCD_PROJECT: default
  DEPLOYMENT_NAME: pk-bkd-ms-api-stuart
  DEPLOYMENT_NAMESPACE: discord

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image repository name
        id: meta
        run: |
          REPO_NAME="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ env.IMAGE_NAME }}"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-argocd:
    name: Deploy to ArgoCD
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.ARGOCD_TAILSCALE_HOST }}

      - name: Get ArgoCD token
        id: argocd-token
        run: |
          response=$(curl -skf -X POST "http://${{ secrets.ARGOCD_TAILSCALE_HOST }}:8081/api/v1/session" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.ARGOCD_USERNAME }}\",\"password\":\"${{ secrets.ARGOCD_PASSWORD }}\"}")
          token=$(echo "$response" | jq -r '.token')
          if [ "$token" = "null" ] || [ -z "$token" ]; then
            echo "::error::Falha ao obter token do ArgoCD"
            exit 1
          fi
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger ArgoCD sync
        run: |
          curl -skf -X POST "http://${{ secrets.ARGOCD_TAILSCALE_HOST }}:8081/api/v1/applications/${{ env.ARGOCD_APP_NAME }}/sync" \
            -H "Authorization: Bearer ${{ steps.argocd-token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{"prune": true, "force": true}'

      - name: Rollout restart (via ArgoCD RunResourceActionV2 API)
        run: |
          curl -skf -X POST "http://${{ secrets.ARGOCD_TAILSCALE_HOST }}:8081/api/v1/applications/${{ env.ARGOCD_APP_NAME }}/resource/actions/v2" \
            -H "Authorization: Bearer ${{ steps.argocd-token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"restart\",\"appNamespace\":\"${{ env.ARGOCD_APP_NAMESPACE }}\",\"group\":\"apps\",\"kind\":\"Deployment\",\"name\":\"${{ env.DEPLOYMENT_NAME }}\",\"namespace\":\"${{ env.DEPLOYMENT_NAMESPACE }}\",\"project\":\"${{ env.ARGOCD_PROJECT }}\",\"resourceName\":\"${{ env.DEPLOYMENT_NAME }}\",\"version\":\"v1\"}"
